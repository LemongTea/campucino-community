<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export YouTube cookies</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { width: 320px; margin: 0; padding: 18px; background: #111827; color: #f9fafb; }
    h1 { margin: 0 0 8px; font-size: 17px; }
    p { color: #cbd5e1; font-size: 12px; line-height: 1.45; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 11px; background: #facc15; color: #111827; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 18px; margin-top: 10px; font-size: 12px; }
    .warning { margin-top: 12px; padding: 9px; border: 1px solid #92400e; border-radius: 7px; color: #fde68a; background: #451a03; }
  </style>
</head>
<body>
  <h1>YouTube cookie exporter</h1>
  <p>Pastikan Anda sudah login ke YouTube pada profil Chrome ini.</p>
  <button id="export">Download youtube-cookies.txt</button>
  <div id="status" role="status"></div>
  <div class="warning">File ini sangat sensitif. Jangan kirim atau commit ke repository.</div>
  <script src="popup.js"></script>
</body>
</html>
